name: Archive Clarity traffic statistics

on:
  schedule:
    # 00:05 WIB daily (GitHub cron uses UTC).
    - cron: "5 17 * * *"

permissions:
  contents: write

jobs:
  archive-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch one Clarity snapshot
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: python .github/scripts/fetch_clarity_traffic.py

      - name: Commit updated public statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-stats.json
          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
            exit 0
          fi
          git commit -m "Update daily Clarity traffic statistics"
          git push
