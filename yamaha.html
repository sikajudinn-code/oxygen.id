<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="Dealer Yamaha Kalimantan Barat. Konsultasi via WhatsApp dan lihat katalog motor Yamaha.">
  <title>Dealer Yamaha Kalbar — Motorkalbar</title>
  <style>
    :root{color-scheme:light;--ink:#101c2e;--red:#e52531;--blue:#1455b8;--green:#18a957}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse at 85% 28%,rgba(87,163,224,.17),transparent 35%),radial-gradient(ellipse at 15% 54%,rgba(255,222,218,.32),transparent 34%),#f7f8fb}
    header{width:min(100%,1000px);margin:auto;padding:20px 26px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none}
    .mark{width:29px;height:29px;display:grid;place-items:center;border:1px solid #202a3a;border-radius:50%;font-size:11px;font-weight:850;letter-spacing:-.08em}
    .brand-copy{display:grid;gap:1px}
    .brand-name{font-size:13px;font-weight:800;letter-spacing:-.045em}
    .tagline{color:#8c929c;font-size:7px;font-weight:700;letter-spacing:.13em}
    .location{display:flex;align-items:center;gap:6px;color:#828a96;font-size:10px}
    .location svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7}
    main{width:min(100%,1000px);margin:auto;padding:36px 20px 52px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    h1{margin:0 0 28px;font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.06em;font-weight:790}
    h1 span{color:var(--red)}
    .actions{width:min(100%,420px);display:grid;grid-template-columns:1fr;gap:13px}
    .action{position:relative;isolation:isolate;overflow:hidden;min-height:86px;display:flex;align-items:center;gap:14px;padding:15px 20px;border:1px solid rgba(255,255,255,.8);border-radius:17px;color:#2b1240;text-align:left;text-decoration:none;box-shadow:0 0 0 2px rgba(126,43,232,.13),0 10px 25px rgba(88,42,138,.2),0 0 24px rgba(255,210,36,.28);-webkit-tap-highlight-color:transparent;transition:transform .16s ease,box-shadow .16s ease}
    .action::before{position:absolute;z-index:-1;inset:0;content:"";background-size:300% 100%;animation:gradient-flow 2.25s ease-in-out infinite}
    .action:hover{transform:translateY(-2px);box-shadow:0 15px 32px rgba(19,42,77,.18)}
    .action:active{transform:scale(.985)}
    .action:focus-visible{outline:3px solid #f0a42b;outline-offset:4px}
    .wa::before,.catalog::before{background-image:linear-gradient(110deg,#7627e8 0%,#ac4cff 18%,#f5e9ff 34%,#fff 44%,#fff0a0 57%,#ffd52e 69%,#fff 82%,#7627e8 100%)}
    .catalog::before{animation-delay:-1.1s}
    .icon{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border:1px solid rgba(52,22,83,.15);border-radius:14px;background:rgba(255,255,255,.72)}
    .icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .label{font-size:16px;font-weight:760;letter-spacing:-.025em}
    .arrow{width:19px;height:19px;flex:0 0 19px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    footer{padding:16px 20px;background:#111e31;color:#b8c0cd;text-align:center;font-size:10px}
    footer strong{color:#fff;font-weight:650}
    @keyframes gradient-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    @media(max-width:560px){header{padding:17px 19px}main{padding:24px 20px 34px}h1{margin-bottom:24px;font-size:clamp(29px,8.5vw,38px)}.actions{gap:11px}.action{min-height:82px;padding:14px 17px}.label{font-size:15px}footer{font-size:9px}}
    @media(max-width:350px){header{padding-right:14px;padding-left:14px}.location{font-size:9px}main{padding-right:14px;padding-left:14px}.action{padding-right:14px;padding-left:14px}}
    @media(prefers-reduced-motion:reduce){.action::before{animation:none;background-position:50% 50%}*,*::after,*::before{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>

        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a8.2 8.2 0 0 1-12.1 7.2L4 20l1.3-3.7A8.2 8.2 0 1 1 20 11.5Z"/><path d="M9 8.5c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.2.1.4-.1.6l-.5.6c-.2.2-.2.4 0 .6.5.9 1.2 1.5 2.1 2 .2.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.3.3.5 0 .3-.2 1-.6 1.3-.4.4-1 .6-1.7.5-1-.1-2.3-.7-3.6-1.8-1.4-1.2-2.3-2.8-2.5-3.8-.2-.8 0-1.4.7-1.9Z"/></svg></span>
        <span class="label">Chat WhatsApp</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="action catalog" href="https://yamaha.motorkalbar.my.id/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 17a2.5 2.5 0 0 1 2.5-2.5H20M8 7h8M8 10h6"/></svg></span>
        <span class="label">Katalog Yamaha</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </nav>
  </main>
  <footer>© motorkalbar.my.id <strong>· Yamaha</strong></footer>
</body>
</html>
